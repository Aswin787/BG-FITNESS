<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG-FITNESS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}
html{scroll-behavior:smooth;}
body{
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 5%;
  background:#000;
  position:sticky;
  top:0;
  z-index:1000;
}
.logo{
  display:flex;
  align-items:center;
  gap:8px;
  color:#00ff88;
  font-weight:700;
}
.logo img{
  height:60px;
}
nav{
  display:flex;
  gap:20px;
}
nav a{
  font-weight:600;
}
nav a:hover{color:#00ff88;}

/* HERO */
.hero{
  height:90vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438") center/cover no-repeat;
  position:relative;
  text-align:center;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.7);
}
.hero-content{
  position:relative;
  z-index:1;
}
.hero h2{
  font-size:clamp(1.8rem,4vw,3rem);
  background:linear-gradient(90deg,#00ff88,#00ccff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero button{
  margin-top:20px;
  padding:12px 28px;
  background:#00ff88;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}
.hero button:hover{background:#00cc66;}

/* ===== FIRST GALLERY ===== */
.gallery-section{
  padding:40px 5% 20px;
  text-align:center;
}
.gallery-section h2{
  color:#00ff88;
  margin-bottom:30px;
}

/* ===== SECOND GALLERY ===== */
.gallery-section2{
  padding:40px 5% 20px;
  text-align:center;
}
.gallery-section2 h2{
  color:#00ff88;
  margin-bottom:30px;
}

/* INFINITE SCROLL */
.infinite-scroll-container{
  width:100%;
  overflow:hidden;
  background:#111;
  border-radius:12px;
  padding:20px 0;
}
.infinite-scroll-track{
  display:flex;
  width:max-content;
  gap:20px;
  animation:scroll-left 70s linear infinite; /* ⬅ slower */
}
.infinite-scroll-card{
  flex-shrink:0;
  width:400px;
  height:500px;
  border-radius:12px;
  overflow:hidden;
}
.infinite-scroll-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

@keyframes scroll-left{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* MOBILE */
@media(max-width:768px){
  .infinite-scroll-card{
    width:200px;
    height:250px;
  }
}

/* SERVICES */
.services{
  padding:60px 5%;
  text-align:center;
}
.services h2{color:#00ff88;margin-bottom:40px;}
.service-boxes{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}
.service{
  background:#111;
  padding:20px;
  border-radius:12px;
  max-width:300px;
}
.service:hover{transform:translateY(-6px);}

/* COACH */
.coach{
  padding:60px 5%;
  text-align:center;
}
.coach h2{color:#00ff88;margin-bottom:40px;}
.coach-card{
  background:#111;
  padding:20px;
  border-radius:16px;
  max-width:350px;
  margin:auto;
}
.coach-card img{
  width:180px;
  height:180px;
  border-radius:50%;
  border:3px solid #00ff88;
}

/* CONTACT */
.contact{
  padding:60px 5%;
  text-align:center;
}
.contact h2{color:#00ff88;margin-bottom:40px;}
.contact-container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}
.contact-card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  max-width:250px;
}

/* FOOTER */
footer{
  padding:20px;
  text-align:center;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <h1 class="logo">
    <img src="bG-images/Logo.png">
    BG-FITNESS
  </h1>
  <nav>
    <a href="#services">Services</a>
    <a href="#coach">Coach</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>✨ 120-day 1-on-1 Fitness Coaching ✨</h2>
    <button onclick="window.location.href='index7.html'">Book Now</button>
  </div>
</section>

<!-- FIRST GALLERY -->
<section class="gallery-section">
  <h2>💪 My Transformations</h2>
  <div class="infinite-scroll-container">
    <div class="infinite-scroll-track" id="gallery-transformations"></div>
  </div>
</section>

<!-- SECOND GALLERY -->
<section class="gallery-section2">
  <h2>Our Achievements</h2>
  <div class="infinite-scroll-container">
    <div class="infinite-scroll-track" id="gallery-achievements"></div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded",()=>{

  const transformations=[
    "bG-images/Godson-T (1).webp",
    "bG-images/Godson-s6 (1).webp",
    "bG-images/Godson-U (1).webp",
    "bG-images/Godson-U6 (1).webp",
    "bG-images/Godson-Shirt (1).webp",
    "bG-images/Godson-BB (1).webp"
  ];

  const achievements=[];
  for(let i=1;i<=53;i++){
    achievements.push(`bG-images/${i}.webp`);
  }

  function buildInfiniteGallery(id,images){
    const track=document.getElementById(id);
    [...images,...images].forEach(src=>{
      const card=document.createElement("div");
      card.className="infinite-scroll-card";
      const img=document.createElement("img");
      img.src=src;
      img.loading="lazy";
      card.appendChild(img);
      track.appendChild(card);
    });
  }

  buildInfiniteGallery("gallery-transformations",transformations);
  buildInfiniteGallery("gallery-achievements",achievements);

});
</script>

</body>
</html>
